<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #f3f3f3;
        }

        .slider {
            width: 360px;
            height: 150px;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
        }

        /* SLIDES */
        .slides {
            display: flex;
            width: 300%;
            height: 100%;
            animation: slide 9s infinite;
        }

        .slide {
            width: 100%;
            flex-shrink: 0;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* BOTTOM CUT */
        .slider::after {
            content: "";
            position: absolute;
            width: 90px;
            height: 40px;
            background: #f3f3f3;
            left: 50%;
            bottom: -20px;
            transform: translateX(-50%);
            border-radius: 50px;
            z-index: 20;
        }

        /* DOTS */
        .dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.5);
            animation: dots 9s infinite;
        }

        .dot:nth-child(1) {
            animation-delay: 0s;
        }

        .dot:nth-child(2) {
            animation-delay: 3s;
        }

        .dot:nth-child(3) {
            animation-delay: 6s;
        }

        /* SLIDE ANIMATION */
        @keyframes slide {

            0%,
            28% {
                transform: translateX(0%);
            }

            33%,
            61% {
                transform: translateX(-100%);
            }

            66%,
            94% {
                transform: translateX(-200%);
            }

            100% {
                transform: translateX(0%);
            }
        }

        /* ACTIVE DOT */
        @keyframes dots {

            0%,
            28% {
                width: 30px;
                background: #b6d84a;
            }

            33%,
            100% {
                width: 10px;
                background: rgba(255, 255, 255, 0.5);
            }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">

    <div class="slider">

        <!-- Slides -->
        <div class="slides">

            <div class="slide">
                <img
                    src="https://web.ztorespot.in/uploads/images/6683/2026/05/11/1778481018/www.smartkadai.in.png">
            </div>

            <div class="slide">
                <img
                    src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1200&auto=format&fit=crop">
            </div>

            <div class="slide">
                <img
                    src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1200&auto=format&fit=crop">
            </div>

        </div>

        <!-- Dots -->
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

    </div>

</body>

</html>
